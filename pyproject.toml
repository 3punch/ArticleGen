[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "articlegen"
version = "0.1.0"
description = "Iterative multi-agent article/code pipeline with bounded context and an append-only change log"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Deliberately empty: the package runs on the standard library alone so the loop is
# executable in constrained/free-tier environments.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
# The pipeline core stays dependency-free. ProjectForge's API stack is opt-in.
projectforge-api = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]
projectforge-worker = [
  "rq>=2.0,<3",
  "redis>=5.0,<7",
]
projectforge-agents = ["litellm>=1.74,<2", "langgraph>=1.0,<2"]
projectforge-sandbox = ["docker>=7.1,<8"]
# The ArticleGen dashboard remains opt-in and independent of ProjectForge.
ui = ["streamlit>=1.49", "pandas>=2.0"]

[project.scripts]
articlegen = "articlegen.cli:main"
projectforge-api = "projectforge_api.cli:main"
projectforge-worker = "projectforge_orchestrator.worker:main"

[tool.setuptools]
packages = [
  "articlegen", "articlegen.agents", "articlegen.ui",
  "projectforge_api", "projectforge_schemas", "projectforge_agents",
  "projectforge_orchestrator", "projectforge_sandbox",
]

[tool.setuptools.package-dir]
projectforge_api = "apps/api"
projectforge_schemas = "packages/schemas"
projectforge_agents = "packages/agents"
projectforge_orchestrator = "packages/orchestrator"
projectforge_sandbox = "packages/sandbox"

[tool.setuptools.package-data]
projectforge_agents = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: requires Docker Engine and prebuilt ProjectForge sandbox images"]
